<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline | Blue Box ERP</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #0f172a; color: #e2e8f0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px; }
  main { max-width: 380px; text-align: center; }
  h1 { font-size: 20px; margin: 0 0 8px; color: #fff; }
  p { font-size: 14px; line-height: 1.6; color: #94a3b8; margin: 0 0 20px; }
  a, button { display: inline-block; font: inherit; font-size: 14px; font-weight: 600; padding: 10px 16px; border-radius: 8px;
              border: 1px solid #334155; background: transparent; color: #e2e8f0; text-decoration: none; cursor: pointer; margin: 0 4px 8px; }
  button { background: #2563eb; border-color: #2563eb; color: #fff; }
</style>
</head>
<body>
<main>
  <h1>You're offline</h1>
  <p>This page has not been opened on this device before, so there is no saved copy of it to show. Pages you have already opened still work without a connection.</p>
  <button onclick="location.reload()">Try again</button>
  <a href="/">Go to dashboard</a>
</main>
</body>
</html>
